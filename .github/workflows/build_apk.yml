name: Build GoDesa Flutter APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Generate Platform Files & Dependencies
        run: |
          cd flutter_godesa
          flutter create --platforms=android .
          flutter pub get

      - name: Build Android Release APK
        run: |
          cd flutter_godesa
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoDesa-Release-APK
          path: flutter_godesa/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.0.0
          name: 'GoDesa v1.0.0 (Release APK)'
          body: |
            ## 🏛️ GoDesa - Aplikasi Mobile Layanan Digital Perangkat Desa
            Pemerintah Desa Cibuntu, Kecamatan Cibitung, Kabupaten Bekasi.
            
            ### ✨ Fitur Utama:
            - **Gojek UI Mobile-First**: GoDesa Pay Warga ID, Layanan 8-Grid, Carousel Warta.
            - **SOP 4-Tahap Permendagri No. 47/2016**: Warga ➔ Pengantar RT ➔ Mengetahui RW ➔ Loket Desa ➔ e-Signature Kepala Desa.
            - **GoWarga**: Direktori kependudukan lengkap 5 RW & 12 RT se-Desa Cibuntu.
            - **Hybrid API**: Terkoneksi dengan backend hosting `https://maoneart.my.id/godesa/api`.
          files: flutter_godesa/build/app/outputs/flutter-apk/app-release.apk
